<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/menu.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <h1>Main Menu</h1>
                <p class="username">Welcome, <strong>{{username}}</strong></p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <nav class="d-grid gap-3">
                    <a href="/play" class="btn btn-menu btn-play">Play</a>
                    <a href="/profile" class="btn btn-menu btn-profile">Profile</a>
                    <a href="/leaderboard" class="btn btn-menu btn-leaderboard">Leaderboard</a>
                    <a href="/logout" class="btn btn-menu btn-logout">Logout</a>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
