<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/matchmaking.css') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <h1>Finding Match</h1>
                <div class="spinner"></div>
                <div class="status" id="status">Connecting to matchmaking...</div>

                <div class="alert alert-info queue-info" id="queue-info" style="display: none;">
                    <p>Players in queue: <span id="queue-size" class="fw-bold">-</span></p>
                </div>

                <button onclick="cancelMatchmaking()" class="btn btn-danger mt-3">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            withCredentials: true,
            transports: ['websocket', 'polling'],
            path: '/socket.io/'
        });

        let matchFound = false;

        socket.on("connect", () => {
            console.log("Connected to server");
            document.getElementById("status").textContent = "Searching for opponent...";
            socket.emit("joinMatchmaking", {});
        });

        socket.on("queueJoined", (data) => {
            console.log("Joined queue:", data);
            document.getElementById("status").textContent = data.message;
            document.getElementById("queue-info").style.display = "block";
            document.getElementById("queue-size").textContent = data.position;
        });

        socket.on("matchFound", (data) => {
            console.log("Match found!", data);
            document.getElementById("status").textContent = "Match found! Connecting...";

            window.gameCode = data.code;
            matchFound = true;

            socket.emit("joinGame", { code: data.code });
        });

        socket.on("gameReady", () => {
            history.replaceState(null, "", "/play");
            window.location.href = `/game?code=${window.gameCode}`;
        });

        socket.on("queueLeft", (data) => {
            console.log("Left queue:", data);
            window.location.href = "/play";
        });

        socket.on("queueError", (data) => {
            console.log("Queue error:", data);
            document.getElementById("status").textContent = data.message;

            // Optional: send them back after 2 seconds
            setTimeout(() => {
                window.location.href = "/play";
            }, 2000);
        });

        function cancelMatchmaking() {
            socket.emit("leaveMatchmaking");
            window.location.href = "/play";
        }

        window.addEventListener("beforeunload", () => {
            if (!matchFound) {
                socket.emit("leaveMatchmaking");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
