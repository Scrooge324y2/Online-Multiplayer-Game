<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/game_over.css') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <div class="trophy">🏆</div>
                <h1>Game Over</h1>
                <div id="winner" class="alert alert-winner">Waiting for result...</div>
                <button onclick="Menu()" class="btn btn-primary">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            withCredentials: true
        });

        const params = new URLSearchParams(window.location.search);
        let winner = params.get("winner");
        console.log(winner);
        document.getElementById("winner").textContent = `${winner} wins!`;

        function Menu() {
            window.location.href = "/menu";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
