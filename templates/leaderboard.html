<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
</head>
    <body>

        <table>
            <caption>Top 10 Players</caption>
            <tr>
                <th>Rank</th>
                <th>Username</th>
                <th>Wins</th>
            </tr>

            {% for player in players %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ player[0] }}</td>
                <td>{{ player[1] }}</td>
            </tr>
            {% endfor %}
        </table>
        <form action="/menu" method="get">
            <button type="submit">Menu</button>
        </form>

    </body>
</html>
