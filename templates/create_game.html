<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/create_game.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <p class="label">Your Game Code:</p>
                <h1 id="gameCode" class="game-code">{{ code }}</h1>
                <button class="btn btn-success copy-button" onclick="copyCode()">Copy Code</button>

                <div class="alert alert-info info">
                    Share this code with a friend to invite them to your game. They can join by entering this code on the Play screen.
                </div>
            </div>
        </div>
    </div>

    <script>
        function copyCode() {
            const code = document.getElementById('gameCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-button');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
