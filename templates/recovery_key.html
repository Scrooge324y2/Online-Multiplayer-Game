<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/recovery_key.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="mb-4">Account Recovery</h1>

                <p class="lead">Your recovery key is:</p>
                <div class="recovery-key-display">
                    <h2 id="recoveryKey">{{ recovery_key }}</h2>
                    <button class="btn btn-success mt-3" onclick="copyKey()">Copy Key</button>
                </div>

                <div class="alert alert-warning mt-4">
                    <strong>Important:</strong> Please save this key safely. You will need it to recover your account if you forget your password. This is the only time you will see this key.
                </div>

                <button onclick="window.location.href='/menu'" class="btn btn-primary w-100 mt-3">Continue to Menu</button>
            </div>
        </div>
    </div>

    <script>
        function copyKey() {
            const key = document.getElementById('recoveryKey').textContent;
            navigator.clipboard.writeText(key).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
