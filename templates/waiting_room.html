<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/waiting_room.css') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Game Code:</h1>
        <div class="game-code">{{ code }}</div>
        <div class="spinner"></div>
        <h2 class="loading">Waiting for other player...</h2>
        <div class="info">
            Share this code with a friend to let them join your game!
        </div>
    </div>

    <script>
        const socket = io("http://127.0.0.1:5000",{
            withCredentials: true,
            transports: ['websocket', 'polling'],
            path: '/socket.io/'
        });

        socket.on("connect", () => {
            console.log("Connected to waiting room, socket ID:", socket.id);
            socket.emit("joinGame", { code: "{{ code }}" });
        });

        socket.on("gameReady", () => {
            history.replaceState(null, "", "/play");
            window.location.href = "/game?code={{ code }}";
        });

        socket.on("connect_error", (error) => {
            console.error("Connection error:", error);
        });
    </script>
</body>
</html>
