<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Joining Game</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>Game Code: <span class="game-code">{{ code }}</span></h1>
    <h2 class="loading">Waiting for other player...</h2>

    <script>
        const socket = io("http://127.0.0.1:5000",{
            withCredentials: true,
            transports: ['websocket', 'polling'],
            path: '/socket.io/'  // Explicit path
        });

        socket.on("connect", () => {
            console.log("Connected to waiting room, socket ID:", socket.id);
            socket.emit("joinGame", { code: "{{ code }}" });
        });

        socket.on("gameReady", () => {
            history.replaceState(null, "", "/play");
            window.location.href = "/game?code={{ code }}";
        });

        socket.on("connect_error", (error) => {
            console.error("Connection error:", error);
        });
    </script>
</body>
</html>
