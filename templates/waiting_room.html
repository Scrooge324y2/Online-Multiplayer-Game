<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/waiting_room.css') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body text-center">
                <h1>Game Code:</h1>
                <div class="game-code">{{ code }}</div>
                <div class="spinner"></div>
                <h2 class="loading">Waiting for other player...</h2>
                <div class="alert alert-info info">
                    Share this code with a friend to let them join your game!
                </div>
                <button onclick="goBack()" class="btn btn-secondary mt-3">← Back to Play</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            withCredentials: true,
            transports: ['websocket', 'polling'],
            path: '/socket.io/'
        });

        socket.on("connect", () => {
            console.log("Connected to waiting room, socket ID:", socket.id);
            socket.emit("joinGame", { code: "{{ code }}" });
        });

        socket.on("gameReady", () => {
            history.replaceState(null, "", "/play");
            window.location.href = "/game?code={{ code }}";
        });

        socket.on("connect_error", (error) => {
            console.error("Connection error:", error);
        });

        function goBack() {
            window.location.href = "/play";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
